<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>보조공학 용어 단어시험</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;font-family:Arial,"Noto Sans KR",sans-serif;color:#222}
.wrap{max-width:820px;margin:30px auto;padding:16px}.card{background:#fff;border-radius:22px;padding:28px;box-shadow:0 10px 35px #0001}
h1{margin:0 0 8px}.sub{color:#777}.sec{margin-top:24px}.lab{font-weight:bold;margin-bottom:10px}
.opts,.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt,.choice{border:1px solid #ddd;background:#fafafa;border-radius:13px;padding:15px;cursor:pointer;font-size:16px;text-align:left}
.opt.sel,.choice.sel{outline:3px solid #888;background:#eee}.start,.primary{background:#222;color:#fff;border:0;border-radius:13px;padding:15px;font-size:17px;cursor:pointer}
.start{width:100%;margin-top:25px}.secondary{background:#eee;border:0;border-radius:13px;padding:13px;font-size:16px;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center}.badge{background:#eee;padding:7px 11px;border-radius:999px}
.bar{height:8px;background:#eee;border-radius:8px;margin:15px 0}.bar div{height:100%;background:#222;width:0}
.q{font-size:34px;font-weight:bold;text-align:center;margin:42px 10px}.answer{width:100%;padding:15px;border:1px solid #ddd;border-radius:12px;font-size:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.result{margin-top:18px;min-height:25px}.ok{color:#16803a;font-weight:bold}.bad{color:#c33;font-weight:bold}
.hidden{display:none}.finish{text-align:center}.score{font-size:42px;font-weight:bold;margin:20px}
@media(max-width:560px){.opts,.choices{grid-template-columns:1fr}.q{font-size:27px}}
</style></head>
<body><div class="wrap"><div class="card">

<div id="setup">
<h1>📚 보조공학 용어 단어시험</h1><p class="sub">문제 유형과 문제 방향을 선택하세요.</p>
<div class="sec"><div class="lab">① 문제 유형</div><div class="opts" id="types">
<button class="opt sel" data-v="mc">🔘 객관식<br><small>4개 보기</small></button>
<button class="opt" data-v="sa">✍️ 주관식<br><small>직접 입력</small></button>
<button class="opt" data-v="mix">🔘✍️ 주관식 + 객관식<br><small>두 유형이 섞여 출제</small></button></div></div>
<div class="sec"><div class="lab">② 문제 방향</div><div class="opts" id="dirs">
<button class="opt sel" data-v="enko">🇺🇸 영어 → 🇰🇷 한국어</button>
<button class="opt" data-v="koen">🇰🇷 한국어 → 🇺🇸 영어</button></div></div>
<div class="sec"><div class="lab">③ 문제 수</div><div class="opts" id="counts">
<button class="opt sel" data-v="32">전체 32문제</button><button class="opt" data-v="20">20문제</button><button class="opt" data-v="10">10문제</button></div></div>
<button class="start" onclick="start()">시험 시작하기</button></div>

<div id="quiz" class="hidden">
<div class="top"><div><h1>📚 단어시험</h1><span id="mode" class="badge"></span></div><span id="score" class="badge">0점</span></div>
<div class="bar"><div id="bar"></div></div><div id="cnt" class="sub"></div><div id="q" class="q"></div>
<div id="choices" class="choices"></div><input id="ans" class="answer hidden" placeholder="정답을 입력하세요">
<div class="actions"><button class="primary" onclick="check()">정답 확인</button><button class="secondary" onclick="next()">다음 문제</button><button class="secondary" onclick="home()">설정으로 돌아가기</button></div>
<div id="res" class="result"></div></div>

<div id="finish" class="hidden finish"><h1>🎉 시험 완료!</h1><div id="final" class="score"></div><p id="pct"></p><button class="start" onclick="home()">다시 선택하기</button></div>
</div></div>

<script>
const W=[('Amputation', '하지 절단'), ('Biceps brachii', '위팔두갈래근'), ('Brachioradialis', '위팔노근'), ('Closed fracture', '닫힌 골절'), ('Control', '제어'), ('Circumferential Compression', '원주성 압박'), ('Deltoid', '어깨 세모근'), ('Dorsi flexsion', '손목 신전'), ('Edema', '부종'), ('Healing', '치유'), ('Humerus', '위팔뼈'), ('Infraspinatus', '가시아래근'), ('Long Thoracic Nerve', '긴가슴신경'), ('Open fracture', '개방성 골절'), ('Overstretching', '과도한 늘림'), ('Overuse', '과사용'), ('Prevention', '예방, 방지'), ('Radial Nerve Palsy', '요골신경 마비'), ('Re-trimming', '재트리밍'), ('Retraction', '뒤당김'), ('Rotator Cuff', '회전근개'), ('Scapula', '어깨뼈'), ('Serratus Anterior', '앞톱니근'), ('Sling', '슬링'), ('Static', '고정'), ('Stabilization', '안정'), ('Subluxation', '아탈구'), ('Supraspinatus', '가시위근'), ('Tennis Elbow', '테니스 엘보'), ('Ulnar deviation', '자쪽 편위'), ('Winging Scapula', '날개 어깨뼈'), ('Wrist Drop', '손목 처짐')];
let type='mc',dir='enko',count=32,qs=[],i=0,score=0,done=false,qt='';
const $=id=>document.getElementById(id);
const sh=a=>[...a].sort(()=>Math.random()-0.5);
function bind(id,set){document.querySelectorAll('#'+id+' .opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' .opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');set(b.dataset.v)})}
bind('types',v=>type=v);bind('dirs',v=>dir=v);bind('counts',v=>count=+v);
function start(){qs=sh(W).slice(0,count);i=0;score=0;$('setup').classList.add('hidden');$('finish').classList.add('hidden');$('quiz').classList.remove('hidden');show()}
function show(){
 if(i>=qs.length)return finish(); done=false;
 let e=qs[i][0],k=qs[i][1],prompt=dir==='enko'?e:k,correct=dir==='enko'?k:e;
 qt=type==='mix'?(Math.random()<.5?'mc':'sa'):type;
 $('q').textContent=prompt;$('q').dataset.a=correct;$('cnt').textContent=(i+1)+' / '+qs.length;$('score').textContent=score+'점';
 $('bar').style.width=(i/qs.length*100)+'%';$('res').textContent='';$('ans').value='';$('mode').textContent=qt==='mc'?'객관식':'주관식';
 $('choices').innerHTML='';$('choices').classList.toggle('hidden',qt==='sa');$('ans').classList.toggle('hidden',qt==='mc');
 if(qt==='mc'){
   let pool=W.map(x=>dir==='enko'?x[1]:x[0]).filter(x=>x!==correct);
   sh([correct,...sh(pool).slice(0,3)]).forEach(t=>{let b=document.createElement('button');b.className='choice';b.textContent=t;
     b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');$('choices').dataset.s=t};
     $('choices').appendChild(b)
   })
 }
}
function norm(s){return s.trim().toLowerCase().replace(/\s+/g,' ')}
function check(){
 if(done)return;let a=$('q').dataset.a,u=qt==='mc'?($('choices').dataset.s||''):$('ans').value;
 if(!u){$('res').innerHTML='<span class="bad">정답을 선택하거나 입력해주세요.</span>';return}
 done=true;
 if(norm(u)===norm(a)){score++;$('res').innerHTML='<span class="ok">⭕ 정답!</span>'}
 else $('res').innerHTML='<span class="bad">❌ 오답!</span> 정답: <b>'+a+'</b>';
 $('score').textContent=score+'점'
}
function next(){if(!done){check();if(!done)return}i++;show()}
function finish(){$('quiz').classList.add('hidden');$('finish').classList.remove('hidden');$('final').textContent=score+' / '+qs.length;$('pct').textContent='정답률 '+Math.round(score/qs.length*100)+'%'}
function home(){$('quiz').classList.add('hidden');$('finish').classList.add('hidden');$('setup').classList.remove('hidden')}
$('ans').addEventListener('keydown',e=>{if(e.key==='Enter')check()});
</script></body></html>
